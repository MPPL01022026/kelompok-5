<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="215" viewBox="0 0 1100 215" role="img" aria-label="Tusuk progres fase WBS: 4 dari 7 fase selesai" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<style>
.flow{stroke-dasharray:16 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s ease-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.tick{stroke-dasharray:1;stroke-dashoffset:1;animation:tick .5s ease-out forwards}
@keyframes tick{to{stroke-dashoffset:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>
<defs><radialGradient id="c" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#6cb8ff"/><stop offset="1" stop-color="#1f5fbf"/></radialGradient>
