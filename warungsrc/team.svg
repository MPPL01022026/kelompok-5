<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020b24"/>
      <stop offset="45%" stop-color="#063b91"/>
      <stop offset="100%" stop-color="#021b55"/>
      <animate attributeName="x1" values="0%;35%;0%" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#00a8ff" stop-opacity=".15"/>
      <stop offset="45%" stop-color="#48e8ff"/>
      <stop offset="100%" stop-color="#006eff" stop-opacity=".2"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#b8eaff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#70d9ff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect x="0" y="0" width="1400" height="300" rx="28"/>
    </clipPath>

    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#38dfff" opacity=".55"/>
    </pattern>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="1400" height="300" fill="url(#bg)"/>

    <!-- Moving ambient glow -->
    <ellipse cx="300" cy="120" rx="300" ry="100" fill="#008cff" opacity=".14" filter="url(#strongGlow)">
      <animate attributeName="cx" values="250;1100;250" dur="12s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Tech dot fields -->
    <rect x="25" y="35" width="220" height="90" fill="url(#dots)" opacity=".7"/>
    <rect x="1160" y="170" width="220" height="90" fill="url(#dots)" opacity=".7"/>

    <!-- Border -->
    <rect x="8" y="8" width="1384" height="284" rx="27"
          fill="none" stroke="#159cff" stroke-width="3" opacity=".9" filter="url(#glow)"/>
    <rect x="18" y="18" width="1364" height="264" rx="22"
          fill="none" stroke="#72eaff" stroke-width="1" opacity=".35"/>

    <!-- Corner tech marks -->
    <g fill="none" stroke="#42dfff" stroke-width="3" opacity=".9">
      <path d="M35 72 V38 H110"/>
      <path d="M1290 38 H1365 V72"/>
      <path d="M35 228 V262 H110"/>
      <path d="M1290 262 H1365 V228"/>
    </g>

    <!-- Moving top light beam -->
    <rect x="-250" y="0" width="180" height="300"
          fill="#7feaff" opacity=".13" transform="skewX(-18)">
      <animate attributeName="x" values="-300;1500;-300" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Animated neon waves -->
    <path d="M-80 205 C170 95 250 285 520 185 S900 90 1130 190 S1290 230 1480 115"
          fill="none" stroke="#00bfff" stroke-width="12" opacity=".35" filter="url(#strongGlow)">
      <animate attributeName="d"
        values="
        M-80 205 C170 95 250 285 520 185 S900 90 1130 190 S1290 230 1480 115;
        M-80 165 C180 280 300 75 540 165 S890 280 1140 145 S1310 75 1480 190;
        M-80 205 C170 95 250 285 520 185 S900 90 1130 190 S1290 230 1480 115"
        dur="7s" repeatCount="indefinite"/>
    </path>

    <path d="M-80 215 C170 105 250 295 520 195 S900 100 1130 200 S1290 240 1480 125"
          fill="none" stroke="url(#cyan)" stroke-width="4" filter="url(#glow)">
      <animate attributeName="d"
        values="
        M-80 215 C170 105 250 295 520 195 S900 100 1130 200 S1290 240 1480 125;
        M-80 175 C180 290 300 85 540 175 S890 290 1140 155 S1310 85 1480 200;
        M-80 215 C170 105 250 295 520 195 S900 100 1130 200 S1290 240 1480 125"
        dur="7s" repeatCount="indefinite"/>
    </path>

    <path d="M-80 235 C180 140 300 310 540 210 S900 120 1140 215 S1320 250 1480 150"
          fill="none" stroke="#70eaff" stroke-width="1.5" opacity=".8">
      <animate attributeName="d"
        values="
        M-80 235 C180 140 300 310 540 210 S900 120 1140 215 S1320 250 1480 150;
        M-80 195 C180 310 320 110 540 195 S900 310 1140 175 S1320 110 1480 215;
        M-80 235 C180 140 300 310 540 210 S900 120 1140 215 S1320 250 1480 150"
        dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- Floating particles -->
    <g fill="#8ff3ff" filter="url(#glow)">
      <circle cx="280" cy="65" r="3">
        <animate attributeName="cy" values="65;45;65" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="62" r="3">
        <animate attributeName="cy" values="62;42;62" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="120" r="2">
        <animate attributeName="cy" values="120;100;120" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" cy="170" r="2">
        <animate attributeName="cy" values="170;150;170" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1210" cy="75" r="2">
        <animate attributeName="cy" values="75;55;75" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Animated hexagons -->
    <g fill="none" stroke="#20cfff" stroke-width="2" opacity=".7">
      <polygon points="82,105 101,94 120,105 120,127 101,138 82,127">
        <animateTransform attributeName="transform" type="rotate"
          values="0 101 116;360 101 116" dur="12s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="1280,90 1300,78 1320,90 1320,114 1300,126 1280,114">
        <animateTransform attributeName="transform" type="rotate"
          values="360 1300 102;0 1300 102" dur="10s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Team icon with orbit -->
    <g>
      <ellipse cx="285" cy="128" rx="62" ry="31"
               fill="none" stroke="#2ee8ff" stroke-width="3" opacity=".9">
        <animateTransform attributeName="transform" type="rotate"
          values="0 285 128;360 285 128" dur="6s" repeatCount="indefinite"/>
      </ellipse>

      <circle cx="270" cy="116" r="15" fill="#704cff" filter="url(#glow)"/>
      <circle cx="301" cy="116" r="15" fill="#8d6dff" filter="url(#glow)"/>
      <path d="M247 153 C247 133 291 133 291 153 Z"
            fill="#6744f5" filter="url(#glow)"/>
      <path d="M278 153 C278 133 322 133 322 153 Z"
            fill="#8364ff" filter="url(#glow)"/>

      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -5;0 0" dur="2.5s" repeatCount="indefinite"/>
    </g>

    <!-- Title -->
    <text x="770" y="125" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="38" font-weight="900"
          fill="url(#title)" filter="url(#glow)">
      TIM PENGEMBANG &amp; MANAJEMEN PROYEK
      <animate attributeName="opacity" values=".82;1;.82" dur="3s" repeatCount="indefinite"/>
    </text>

    <!-- Animated title underline -->
    <rect x="490" y="143" width="560" height="3" rx="2"
          fill="#27dcff" filter="url(#glow)">
      <animate attributeName="width" values="420;560;420" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x" values="560;490;560" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Subtitle -->
    <text x="770" y="178" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="19" fill="#d9f7ff">
      Teknik Informatika • Manajemen Proyek Perangkat Lunak
      <animate attributeName="opacity" values=".65;1;.65" dur="3.5s" repeatCount="indefinite"/>
    </text>

    <!-- Moving dots beside subtitle -->
    <circle cx="470" cy="172" r="4" fill="#39eaff" filter="url(#glow)">
      <animate attributeName="cx" values="470;500;470" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="172" r="4" fill="#39eaff" filter="url(#glow)">
      <animate attributeName="cx" values="1070;1040;1070" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Tech chevrons -->
    <g fill="#36ddff">
      <path d="M1070 55 l18 12 -18 12 7 -12z">
        <animateTransform attributeName="transform" type="translate"
          values="0 0;12 0;0 0" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M1098 55 l18 12 -18 12 7 -12z">
        <animateTransform attributeName="transform" type="translate"
          values="0 0;12 0;0 0" dur="1.4s" begin=".2s" repeatCount="indefinite"/>
      </path>
      <path d="M1126 55 l18 12 -18 12 7 -12z">
        <animateTransform attributeName="transform" type="translate"
          values="0 0;12 0;0 0" dur="1.4s" begin=".4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Bottom moving scanner -->
    <rect x="100" y="260" width="160" height="2" fill="#3deaff" filter="url(#glow)">
      <animate attributeName="x" values="80;1160;80" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>