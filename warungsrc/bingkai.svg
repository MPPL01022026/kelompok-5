<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="40" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- garis gelombang -->
  <path id="wave" d="M0 30 Q 300 10, 600 30 T 1200 30" stroke="url(#divider-grad)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- titik cahaya berjalan di sepanjang gelombang -->
  <circle r="4" fill="#7DD3FC" filter="url(#glow)" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#wave"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#E0F2FE" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#wave"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- cincin riak dari bola tengah -->
  <circle cx="600" cy="30" r="5" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0">
    <animate attributeName="r" values="5;22" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="30" r="5" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0">
    <animate attributeName="r" values="5;22" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- bola tengah: berdenyut -->
  <circle cx="600" cy="30" r="5" fill="#3B82F6">
    <animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </circle>

  <!-- bola kiri: bergerak menjauh dan mendekat -->
  <circle cx="580" cy="30" r="3" fill="#38BDF8">
    <animate attributeName="cx" values="580;556;580" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <animate attributeName="cy" values="30;24;30" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- bola kanan: gerak berlawanan arah -->
  <circle cx="620" cy="30" r="3" fill="#38BDF8">
    <animate attributeName="cx" values="620;644;620" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <animate attributeName="cy" values="30;36;30" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
