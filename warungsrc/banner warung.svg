<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1915 568" width="1915" height="568" role="img" aria-label="Sistem Monitoring Stok Bahan Makanan - Warung Mi Ayam Mas Tono">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#12301e"/><stop offset="0.55" stop-color="#2b3d17"/><stop offset="1" stop-color="#6b2a0b"/></linearGradient>
<radialGradient id="glowL" cx="0.2" cy="0.55" r="0.5"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<radialGradient id="circ" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fde68a" stop-opacity="0.38"/><stop offset="1" stop-color="#fb923c" stop-opacity="0.12"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ade80"/><stop offset="0.5" stop-color="#fde047"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
<linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="700" y1="0" x2="1750" y2="0">
<stop offset="0" stop-color="#ffffff"/><stop offset="0.42" stop-color="#ffffff"/><stop offset="0.5" stop-color="#fde047"/><stop offset="0.58" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1100 0;1100 0" dur="5s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6d6" stop-opacity="0"/><stop offset="0.5" stop-color="#fff6d6" stop-opacity="0.28"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/></linearGradient>
<linearGradient id="bowlG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2492f"/><stop offset="1" stop-color="#8f1d12"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
<linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c2d12"/><stop offset="0.6" stop-color="#ea580c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/></filter>
<clipPath id="frame"><rect width="1915" height="568"/></clipPath>
<pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#fff" opacity="0.07"/></pattern>
<path id="star" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3Z"/>
<path id="leaf" d="M0 0 Q12 -22 40 -16 Q34 12 0 0Z M0 0 L30 -10"/>
</defs>

<rect width="1915" height="568" fill="url(#bg)"/>
<rect width="1915" height="568" fill="url(#dots)"/>
<rect width="1915" height="568" fill="url(#glowL)"/>

<g clip-path="url(#frame)">

<!-- lingkaran dekor kanan -->
<circle cx="1820" cy="70" r="170" fill="#fbbf24" opacity="0.10"><animate attributeName="r" values="160;185;160" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="1740" cy="560" r="150" fill="#fb923c" opacity="0.14"><animate attributeName="r" values="140;165;140" dur="8s" repeatCount="indefinite"/></circle>

<!-- lingkaran + cincin putus-putus -->
<circle cx="320" cy="295" r="215" fill="url(#circ)"/>
<circle cx="320" cy="295" r="240" fill="none" stroke="#fde047" stroke-width="2.5" stroke-dasharray="10 14" opacity="0.6">
<animateTransform attributeName="transform" type="rotate" from="0 320 295" to="360 320 295" dur="40s" repeatCount="indefinite"/></circle>
<circle cx="320" cy="295" r="215" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.2">
<animate attributeName="r" values="205;230;205" dur="5.5s" repeatCount="indefinite"/></circle>

<!-- gelombang footer -->
<path fill="url(#wave)" d="M0 516 Q500 470 960 504 T1915 488 V568 H0Z">
<animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 516 Q500 470 960 504 T1915 488 V568 H0Z;M0 500 Q500 520 960 490 T1915 508 V568 H0Z;M0 516 Q500 470 960 504 T1915 488 V568 H0Z"/></path>
<text x="1000" y="538" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff7e6" textLength="780" lengthAdjust="spacing" letter-spacing="3">MANAJEMEN PROYEK PERANGKAT LUNAK KELOMPOK 5</text>

