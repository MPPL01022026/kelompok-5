<g fill="#bbf7d0" stroke="#16a34a" stroke-width="2">
<circle cx="-44" cy="-36" r="6"/><circle cx="10" cy="-30" r="6"/><circle cx="-100" cy="-8" r="5"/><circle cx="52" cy="-62" r="5"/><circle cx="124" cy="-14" r="5"/><circle cx="-8" cy="-74" r="5"/>
</g>
<g stroke="#d9a066" stroke-width="9" stroke-linecap="round">
<g>
<animateTransform attributeName="transform" type="rotate" values="0 120 -20;-4 120 -20;0 120 -20" dur="3.6s" repeatCount="indefinite"/>
<line x1="120" y1="-20" x2="262" y2="-168"/><line x1="146" y1="-14" x2="292" y2="-140"/>
</g></g>
<g fill="none" stroke="#fffaf0" stroke-width="11" stroke-linecap="round" filter="url(#soft)">
<path d="M-80 -90 q-16 -34 0 -68 t0 -68" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="4.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 20;8 -60" dur="4.2s" repeatCount="indefinite"/></path>
<path d="M-10 -96 q-16 -34 0 -68 t0 -68" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="4.2s" begin="1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 20;-8 -60" dur="4.2s" begin="1.1s" repeatCount="indefinite"/></path>
