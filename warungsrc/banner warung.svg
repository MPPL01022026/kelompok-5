<rect x="700" y="78" width="470" height="42" rx="21" fill="#0b1a10" fill-opacity="0.6" stroke="#fb923c" stroke-width="2.5"/>
<circle cx="726" cy="99" r="7" fill="#fb923c"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="745" y="107" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="800" fill="#fde68a" textLength="405" lengthAdjust="spacing" letter-spacing="3">SISTEM MONITORING STOK UMKM</text>
</g>

<!-- judul -->
<g font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" stroke="#7c2d12" stroke-width="8" stroke-linejoin="round" paint-order="stroke">
<text x="700" y="212" font-size="92" fill="url(#tg)" textLength="1040" lengthAdjust="spacingAndGlyphs">SISTEM MONITORING</text>
<text x="700" y="312" font-size="92" fill="url(#tg)" textLength="1080" lengthAdjust="spacingAndGlyphs">STOK BAHAN MAKANAN</text>
